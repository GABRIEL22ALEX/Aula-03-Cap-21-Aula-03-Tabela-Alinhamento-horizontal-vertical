<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Alinhamento em Tabelas</title>
    <style>
    body{
        font-family:Arial, Helvetica, sans-serif ;
    }
    table {
        width:400px ;
        height:400px ;
        border-collapse:400px ;
    }
    td { 
        border:1px solid black;
        padding:8px ;

        text-align:center ;
        vertical-align:middle ;
    }
    </style>
</head>
<body>
    <h1>Exercício - Trabalhando com alinhamento</h1>
    <table>
        <tr><td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
    <tr class="linha">
     <td>A2</td>
     <td>B2</td>
     <td class="numero">C2</td>

    </tr>
    <tr>
        <td>A3</td>
        <td>B3</td>
        <td class="numero">C4</td>
        
    </tr>
    <tr>
        <td>A4</td>
        <td class="dado"> </td>
        <td>B4</td>
        
    </tr>
    </table>
</body>
</html>
